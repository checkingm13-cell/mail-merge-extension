<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail Mail Merge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="../../icons/icon-48.png" alt="Logo" class="brand-icon" onerror="this.style.display='none'">
        <div class="brand-info">
          <span class="brand-title">Mail Merge</span>
          <span class="brand-sub">Native Scheduler</span>
        </div>
      </div>
      <div class="header-controls">
        <label class="switch" title="Toggle Background Scheduler">
          <input type="checkbox" id="schedulerToggle" checked>
          <span class="slider"></span>
        </label>
        <button id="btnRefresh" class="btn-icon" title="Refresh & sync campaigns">
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Filter Pills Bar -->
    <nav class="filter-bar">
      <button class="filter-pill active" data-filter="ALL">
        All <span class="pill-count" id="countAll">0</span>
      </button>
      <button class="filter-pill" data-filter="QUEUED">
        Queued <span class="pill-count" id="countQueued">0</span>
      </button>
      <button class="filter-pill" data-filter="COMPLETED">
        Completed <span class="pill-count" id="countCompleted">0</span>
      </button>
      <button class="filter-pill" data-filter="FAILED">
        Failed <span class="pill-count" id="countFailed">0</span>
      </button>
    </nav>

    <!-- Main Content / Campaigns List -->
    <main class="content">
      <div class="campaigns-list" id="campaignsList">
        <!-- Dynamic campaign cards rendered here by popup.js -->
        <div class="empty-state" id="emptyState">
          <svg class="empty-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
          </svg>
          <div class="empty-title">No campaigns found</div>
          <div class="empty-desc">Schedule a mail merge draft directly inside Gmail Compose!</div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="status-indicator">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Scheduler Active</span>
      </div>
      <button id="btnOpenDashboard" class="btn-link" title="Open full diagnostics & logs">
        <span>Diagnostics ↗</span>
      </button>
    </footer>
  </div>

  <!-- Toast feedback -->
  <div id="toast" class="toast">Action completed</div>

  <!-- Scripts -->
  <script src="../db/idb-store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
